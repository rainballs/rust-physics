[package]
name = "rust_physics"
version = "0.1.0"
edition = "2024"

[dependencies]
glam = "0.30"
macroquad = { version = "0.4", optional = true }
rayon = { version = "1", optional = true }

[workspace]
resolver = "3"

[[bench]]
name = "scaling"
harness = false

[features]
rayon = ["dep:rayon"]
macroquad = ["dep:macroquad"]

[[example]]
name = "sandbox"
required-features = ["macroquad"]

[[bench]]
name = "throughput"
harness = false
